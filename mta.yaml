_schema-version: 3.3.0
ID: ZTRE_Backend_1
description: A simple CAP project.
version: 1.0.1
 
modules:
 
- name: ZTRE_Backend_1-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: ZTRE_Backend_1-db
 
- name: ZTRE_Backend_1-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: ZTRE_Backend_1-auth
  - name: ZTRE_Backend_1-db
  - name: ZTRE_Backend_1-connectivity
  - name: ZTRE_Backend_1-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
 
- name: ZTRE_Backend_1-app-deployer
  type: com.sap.application.content
  path: gen
  requires:
  - name: ZTRE_Backend_1-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: app/
    requires:
    - artifacts:
      - cominctremastermessagetype.zip
      name: cominctremastermessagetype
      target-path: app/
    - artifacts:
      - cominctremasterinbidocerrcodes.zip
      name: cominctremasterinbidocerrcodes
      target-path: app/
    - artifacts:
      - cominctremasterscheduler.zip
      name: cominctremasterscheduler
      target-path: app/
 
- name: ZTRE_Backend_1-destination-content
  type: com.sap.application.content
  requires:
  - name: ZTRE_Backend_1-destination
    parameters:
      content-target: true
  - name: ZTRE_Backend_1-html5-repo-host
    parameters:
      service-key:
        name: ZTRE_Backend_1-html5-repo-host-key
  - name: ZTRE_Backend_1-auth
    parameters:
      service-key:
        name: ZTRE_Backend_1-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: ZTRE_Backend_1_html5_repo_host
          ServiceInstanceName: ZTRE_Backend_1-html5-repo-host
          ServiceKeyName: ZTRE_Backend_1-html5-repo-host-key
          sap.cloud.service: ztre.service
        - Authentication: OAuth2UserTokenExchange
          Name: ZTRE_Backend_1_auth
          ServiceInstanceName: ZTRE_Backend_1-auth
          ServiceKeyName: ZTRE_Backend_1-auth-key
          sap.cloud.service: ztre.service
        existing_destinations_policy: update
  build-parameters:
    no-source: true
 
- name: cominctremastermessagetype
  type: html5
  path: app/tremastermessagetype
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
 
- name: cominctremasterinbidocerrcodes
  type: html5
  path: app/tremasterinbidocerrcodes
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
 
- name: cominctremasterscheduler
  type: html5
  path: app/tremasterscheduler
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
 
resources:
 
- name: ZTRE_Backend_1-auth
  type: org.cloudfoundry.managed-service
  parameters:
    service: xsuaa
    service-plan: application
    path: ./xs-security.json
    config:
      xsappname: ZTRE_Backend_1-${org}-${space}
      tenant-mode: dedicated
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
        redirect-uris:
        - https://*.hana.ondemand.com/**
 
- name: ZTRE_Backend_1-db
  type: org.cloudfoundry.managed-service
  parameters:
    service: hana
    service-plan: hdi-shared
 
- name: ZTRE_Backend_1-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
 
- name: ZTRE_Backend_1-destination
  type: org.cloudfoundry.managed-service
  parameters:
    service: destination
    service-plan: lite
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            Name: ZTRE_Backend_1-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
          existing_destinations_policy: update
  requires:
  - name: srv-api
 
- name: ZTRE_Backend_1-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
 
- name: ZTRE_Backend_1-html5-runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
 
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
 
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npx cds build --production